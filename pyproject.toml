[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-chassis"
version = "0.1.0"
description = "Universal portable Telegram bot chassis based on aiogram v3"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aski3108" }]
dependencies = [
    "aiogram>=3.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
